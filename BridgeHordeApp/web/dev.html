<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Horde Survival - Dev</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0e14; overflow: hidden; touch-action: none; user-select: none; }
  #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #note { position: fixed; top: 6px; left: 8px; color: #445; font: 11px monospace; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="note">dev page - logic from game/core.js</div>
<script type="module">
import * as G from "../game/core.js";
import { createAudioEngine } from "../game/audio.js";

// ---------- Canvas setup ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let viewScale = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewScale = Math.min(window.innerWidth / G.W, window.innerHeight / G.H);
  canvas.style.width = Math.floor(G.W * viewScale) + "px";
  canvas.style.height = Math.floor(G.H * viewScale) + "px";
  canvas.width = Math.floor(G.W * viewScale * dpr);
  canvas.height = Math.floor(G.H * viewScale * dpr);
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- Perspective projection ----------
// Core logic is unchanged: y runs 0 (spawn) -> PLAYER_Y (your line).
// The renderer turns that into depth: far away at the horizon, huge up close.
const HORIZON = 195;          // screen y of the vanishing point
const PLINE = 570;            // screen y of your front line
const PERSP = 3.2;            // how aggressive the perspective is
const XS = 1.17;              // horizontal spread at your line
const S_END = 1 / (1 + PERSP);
const ACTOR_SCALE = 1.2;      // global size boost for zombies/soldiers/crates

function proj(x, y) {
  const d = (G.PLAYER_Y - y) / G.PLAYER_Y;      // 0 = at you, 1 = horizon
  let s, sy;
  if (d >= 0) {
    s = 1 / (1 + Math.min(d, 1) * PERSP);
    const sn = (s - S_END) / (1 - S_END);
    sy = HORIZON + (PLINE - HORIZON) * sn;
  } else {
    s = 1 - d * 2.2;                             // rows behind the line grow gently
    sy = PLINE + (y - G.PLAYER_Y) * 1.3;
  }
  return { x: G.W / 2 + (x - G.ROAD_MID) * XS * s, y: sy, s };
}
const fogAlpha = (y) => {
  const d = (G.PLAYER_Y - y) / G.PLAYER_Y;
  return Math.min(1, 0.18 + (1 - Math.min(d, 1)) * 2.2);
};

// ---------- Saved state (localStorage; the app uses AsyncStorage) ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const RUN_KEY = "hordeRun";
const META_KEY = "hordeMeta"; // coins, upgrades, achievements, daily best (G.saveMeta)
const TUTORIAL_KEY = "hordeTutorial"; // "1" once the first-run hints are done
const CRATE_HINT_KEY = "hordeCrateHint"; // "1" once the player has taken a crate
const SETTINGS_KEY = "hordeSettings";
const settings = { music: true, sfx: true, shake: true };
try {
  const saved = JSON.parse(store.get(SETTINGS_KEY) || "{}");
  for (const k of Object.keys(settings)) if (typeof saved[k] === "boolean") settings[k] = saved[k];
} catch {}
function applySettings() {
  if (engine) {
    engine.setMusicOn(settings.music);
    engine.setSfxOn(settings.sfx);
  }
}

// ---------- Game instance ----------
const game = G.newGame();
game.best = Number(store.get("bridgeHordeBest") || 0);
const saveBest = (b) => store.set("bridgeHordeBest", String(b));
const savedMeta = store.get(META_KEY);
if (savedMeta) G.loadMeta(game, savedMeta);
const storeMeta = () => store.set(META_KEY, G.saveMeta(game));
// bring back a run that was left unfinished
const savedRun = store.get(RUN_KEY);
if (savedRun) G.loadRun(game, savedRun);

// ---------- Screens (mirrors App.jsx) ----------
// confirmNew: false, or the kind of run ("run" / "daily") that would replace the waiting one
const ui = { board: false, settings: false, shop: false, awards: false, awardsPage: 0, confirmNew: false };
const toasts = []; // unlocked achievements still to announce: { id, until }
const tutorial = { on: store.get(TUTORIAL_KEY) !== "1", moved: 0, crate: store.get(CRATE_HINT_KEY) !== "1" };
const DAILY_COLOR = "#4dd0c4"; // everything that marks the daily challenge
const today = () => G.dayOf(Date.now());
const btn = (y, h) => ({ x: G.W / 2 - 120, y, w: 240, h });
const half = (x, y, h) => ({ x, y, w: 172, h });
// Main menu: the buttons that start a run, then two rows of two.
const menuGrid = (y) => ({ shop: half(24, y, 54), awards: half(204, y, 54), board: half(24, y + 68, 54), settings: half(204, y + 68, 54) });
// The map button sits on its own at the top; clicking it changes the environment.
const MAP_BTN = { x: 60, y: 96, w: G.W - 120, h: 52 };
const MENU_BTNS = { map: MAP_BTN, fight: btn(310, 64), daily: { x: 24, y: 392, w: G.W - 48, h: 54 }, ...menuGrid(460) };
const RUN_MENU_BTNS = { map: MAP_BTN, resume: btn(310, 64), fight: btn(392, 54), daily: { x: 24, y: 460, w: G.W - 48, h: 54 }, ...menuGrid(528) };
// Achievements screen: one row per entry in G.ACHIEVEMENTS, AWARDS_PER_PAGE
// to a page. The arrows either side of Back turn the page.
const AWARDS_PER_PAGE = 8;
const AWARD_ROWS = G.ACHIEVEMENTS.map((a, i) => ({
  ...a, page: Math.floor(i / AWARDS_PER_PAGE), x: 24, y: 112 + (i % AWARDS_PER_PAGE) * 62, w: G.W - 48, h: 56,
}));
const AWARD_PAGES = Math.ceil(AWARD_ROWS.length / AWARDS_PER_PAGE);
const AWARDS_BACK_BTN = btn(G.H - 68, 48);
const AWARD_PAGE_BTNS = { prev: { x: 24, y: G.H - 68, w: 48, h: 48 }, next: { x: G.W - 72, y: G.H - 68, w: 48, h: 48 } };
// Start again with the kind of run that just ended.
const retry = () => G.resetRun(game, game.daily === null ? null : today());
const CONFIRM_BTNS = { cancel: btn(378, 58), yes: btn(450, 54) };
const HOME_BTN = btn(G.H / 2 + 122, 46);
const BACK_BTN = btn(G.H - 120, 50);
const SETTING_ROWS = [
  { key: "music", label: "Music" },
  { key: "sfx", label: "Sound effects" },
  { key: "shake", label: "Screen shake" },
].map((r, i) => ({ ...r, x: 36, y: 150 + i * 76, w: G.W - 72, h: 60 }));
// Upgrade shop: one row per entry in G.UPGRADES; clicking a row buys a level.
const UPGRADE_ROWS = Object.keys(G.UPGRADES).map((key, i) => ({ key, x: 24, y: 160 + i * 112, w: G.W - 48, h: 96 }));
const hit = (b, wx, wy) => wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h;
const click = () => { if (engine) engine.click(); };

// ---------- Input ----------
let dragging = false, lastPointerX = 0;
const keys = {};
const toWorldX = (clientX) => (clientX - canvas.getBoundingClientRect().left) / viewScale;
const toWorldY = (clientY) => (clientY - canvas.getBoundingClientRect().top) / viewScale;
canvas.addEventListener("pointerdown", (e) => {
  initAudio();
  const wx = toWorldX(e.clientX), wy = toWorldY(e.clientY);
  if (ui.board) { ui.board = false; click(); return; }
  if (ui.settings) {
    const row = SETTING_ROWS.find((r) => hit(r, wx, wy));
    if (row) {
      settings[row.key] = !settings[row.key];
      applySettings();
      store.set(SETTINGS_KEY, JSON.stringify(settings));
      click();
    } else if (hit(BACK_BTN, wx, wy)) {
      ui.settings = false;
      click();
    }
    return;
  }
  if (ui.shop) {
    const row = UPGRADE_ROWS.find((r) => hit(r, wx, wy));
    if (row) {
      if (!G.buyUpgrade(game, row.key)) return; // top level, or not enough coins
      storeMeta();
      click();
    } else if (hit(BACK_BTN, wx, wy)) {
      ui.shop = false;
      click();
    }
    return;
  }
  if (ui.awards) {
    if (hit(AWARDS_BACK_BTN, wx, wy)) { ui.awards = false; click(); }
    else if (ui.awardsPage > 0 && hit(AWARD_PAGE_BTNS.prev, wx, wy)) { ui.awardsPage--; click(); }
    else if (ui.awardsPage < AWARD_PAGES - 1 && hit(AWARD_PAGE_BTNS.next, wx, wy)) { ui.awardsPage++; click(); }
    return;
  }
  if (game.state === "menu") {
    if (ui.confirmNew && game.inRun) {
      // anything but "start new run" keeps the waiting run
      const daily = ui.confirmNew === "daily";
      ui.confirmNew = false;
      if (hit(CONFIRM_BTNS.yes, wx, wy)) G.resetRun(game, daily ? today() : null);
      else click();
      return;
    }
    const btns = game.inRun ? RUN_MENU_BTNS : MENU_BTNS;
    const start = hit(btns.fight, wx, wy) ? "run" : hit(btns.daily, wx, wy) ? "daily" : null;
    if (game.inRun && hit(btns.resume, wx, wy)) { G.resumeRun(game); click(); }
    else if (start) {
      if (game.inRun) { ui.confirmNew = start; click(); } // starting either kind would discard the waiting run
      else G.resetRun(game, start === "daily" ? today() : null);
    }
    else if (hit(btns.map, wx, wy)) { G.cycleEnv(game); storeMeta(); click(); }
    else if (hit(btns.shop, wx, wy)) { ui.shop = true; click(); }
    else if (hit(btns.awards, wx, wy)) { ui.awards = true; ui.awardsPage = 0; click(); }
    else if (hit(btns.board, wx, wy)) { ui.board = true; click(); }
    else if (hit(btns.settings, wx, wy)) { ui.settings = true; click(); }
    return;
  }
  if (game.state === "playing") {
    if (G.inPauseBtn(wx, wy)) { G.togglePause(game); click(); return; }
    dragging = true;
    lastPointerX = wx;
    return;
  }
  // paused or game over
  if (hit(HOME_BTN, wx, wy)) { G.toMenu(game); click(); }
  else if (game.state === "paused") { G.togglePause(game); click(); }
  else retry();
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragging || game.state !== "playing") return;
  const x = toWorldX(e.clientX);
  game.player.x += (x - lastPointerX) * 1.4;
  tutorial.moved += Math.abs(x - lastPointerX);
  lastPointerX = x;
});
window.addEventListener("pointerup", () => (dragging = false));
// Escape works like the Android back button: close a screen, pause a run, or
// leave a paused / finished run for the menu.
function goBack() {
  if (ui.board) ui.board = false;
  else if (ui.settings) ui.settings = false;
  else if (ui.shop) ui.shop = false;
  else if (ui.awards) ui.awards = false;
  else if (ui.confirmNew) ui.confirmNew = false;
  else if (game.state === "playing") G.togglePause(game);
  else if (game.state !== "menu") G.toMenu(game);
}
window.addEventListener("keydown", (e) => {
  keys[e.key] = true;
  if (e.key === "Escape") { goBack(); return; }
  if (e.key === "p") { G.togglePause(game); return; }
  if (e.key !== " " && e.key !== "Enter") return;
  if (ui.board || ui.settings || ui.shop || ui.awards || ui.confirmNew) return;
  initAudio();
  if (game.state === "paused") G.togglePause(game);
  else if (game.state === "menu" && game.inRun) G.resumeRun(game);
  else if (game.state === "gameover") retry();
  else if (game.state !== "playing") G.resetRun(game);
});
window.addEventListener("keyup", (e) => (keys[e.key] = false));
// keep an unfinished run when the tab is hidden or closed
function stash() {
  if (game.state === "playing") G.togglePause(game);
  if (G.hasRun(game)) store.set(RUN_KEY, G.saveRun(game));
}
document.addEventListener("visibilitychange", () => { if (document.hidden) stash(); });
window.addEventListener("pagehide", stash);

// ---------- Sound (shared engine: music + all SFX) ----------
let audio = null, engine = null;
function initAudio() {
  if (!audio) {
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      engine = createAudioEngine(audio);
      engine.startMusic();
      engine.setMood("menu");
      applySettings();
    } catch (e) {}
  }
  if (audio && audio.state === "suspended") audio.resume();
}

// ---------- Scenery: sunset bridge ----------
function drawSky() {
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
  sky.addColorStop(0, "#131b33");
  sky.addColorStop(0.55, "#3d2f52");
  sky.addColorStop(0.85, "#a35a3c");
  sky.addColorStop(1, "#e8955a");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, G.W, HORIZON + 40);

  // low sun with glow
  const sunX = 265, sunY = HORIZON - 8;
  const glow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 70);
  glow.addColorStop(0, "rgba(255,214,140,0.9)");
  glow.addColorStop(1, "rgba(255,214,140,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(sunX - 70, sunY - 70, 140, 140);
  ctx.fillStyle = "#ffdf9e";
  ctx.beginPath(); ctx.arc(sunX, sunY, 16, 0, Math.PI * 2); ctx.fill();

  // drifting clouds
  const t = performance.now() / 1000;
  ctx.fillStyle = "rgba(70,60,95,0.5)";
  for (const [cx, cy, cw] of [[80, 60, 70], [260, 95, 90], [150, 140, 60]]) {
    const ox = ((t * 4 + cx) % (G.W + 160)) - 80;
    ctx.beginPath();
    ctx.ellipse(ox, cy, cw, 13, 0, 0, Math.PI * 2);
    ctx.ellipse(ox + cw * 0.4, cy + 6, cw * 0.6, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawWaterAndCity() {
  // water either side of the bridge
  const wat = ctx.createLinearGradient(0, HORIZON, 0, G.H);
  wat.addColorStop(0, "#7a5a54");
  wat.addColorStop(0.25, "#2c4a63");
  wat.addColorStop(1, "#122a3d");
  ctx.fillStyle = wat;
  ctx.fillRect(0, HORIZON, G.W, G.H - HORIZON);
  // shimmer streaks
  ctx.strokeStyle = "rgba(255,214,140,0.12)";
  ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const y = HORIZON + 14 + i * i * 2.4;
    const w = 20 + i * 14;
    ctx.beginPath(); ctx.moveTo(230 - w / 2, y); ctx.lineTo(230 + w / 2, y); ctx.stroke();
  }
  // distant city skyline
  ctx.fillStyle = "#221d33";
  const bld = [[0,26,22],[26,38,18],[48,20,26],[78,44,20],[102,30,16],[122,52,24],[150,34,18],[172,24,30],[206,46,20],[230,30,16],[250,40,22],[276,22,18],[298,50,20],[322,32,26],[352,42,20],[376,24,24]];
  for (const [bx, bh, bw] of bld) ctx.fillRect(bx, HORIZON - bh, bw, bh + 4);
  // a few lit windows
  ctx.fillStyle = "rgba(255,220,150,0.55)";
  for (let i = 0; i < 26; i++) {
    const bx = (i * 53) % 390, by = HORIZON - 6 - ((i * 29) % 38);
    ctx.fillRect(bx, by, 2, 3);
  }
}

function roadEdge(d, side) {
  const s = 1 / (1 + d * PERSP);
  const sn = (s - S_END) / (1 - S_END);
  const y = HORIZON + (PLINE - HORIZON) * sn;
  const x = G.W / 2 + ((side === "l" ? G.ROAD_L : G.ROAD_R) - G.ROAD_MID) * XS * s;
  return { x, y, s };
}

function drawBridge() {
  // deck: trapezoid from below the screen to the horizon
  const nearS = 1.55;
  const nl = G.W / 2 + (G.ROAD_L - G.ROAD_MID) * XS * nearS;
  const nr = G.W / 2 + (G.ROAD_R - G.ROAD_MID) * XS * nearS;
  const fl = roadEdge(1, "l"), fr = roadEdge(1, "r");
  const deck = ctx.createLinearGradient(0, HORIZON, 0, G.H);
  deck.addColorStop(0, "#57504e");
  deck.addColorStop(1, "#3a3f47");
  ctx.fillStyle = deck;
  ctx.beginPath();
  ctx.moveTo(nl, G.H); ctx.lineTo(fl.x, fl.y); ctx.lineTo(fr.x, fr.y); ctx.lineTo(nr, G.H);
  ctx.closePath(); ctx.fill();

  // center dashes marching into the distance
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  for (let i = 0; i < 14; i++) {
    const d0 = i / 14, d1 = d0 + 0.55 / 14;
    const a = proj(G.ROAD_MID, G.PLAYER_Y * (1 - d0));
    const b = proj(G.ROAD_MID, G.PLAYER_Y * (1 - d1));
    ctx.beginPath();
    ctx.moveTo(a.x - 2.6 * a.s, a.y); ctx.lineTo(a.x + 2.6 * a.s, a.y);
    ctx.lineTo(b.x + 2.6 * b.s, b.y); ctx.lineTo(b.x - 2.6 * b.s, b.y);
    ctx.closePath(); ctx.fill();
  }

  // railings: edge lines + posts
  for (const side of ["l", "r"]) {
    const n = roadEdge(-0.001, side); // just at the line, extended below by deck
    const f = roadEdge(1, side);
    const nx = side === "l" ? nl : nr;
    ctx.strokeStyle = "#20242c";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(nx, G.H); ctx.lineTo(f.x, f.y); ctx.stroke();
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 16; i++) {
      const d = i / 15;
      const e = roadEdge(d, side);
      const ph = 26 * e.s;
      ctx.strokeStyle = "#2b303a";
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x, e.y - ph); ctx.stroke();
    }
    // top rail
    ctx.strokeStyle = "#3a404d";
    ctx.lineWidth = 3;
    const n2 = roadEdge(0, side), f2 = roadEdge(1, side);
    ctx.beginPath(); ctx.moveTo(nx, G.H - 40); ctx.lineTo(n2.x, n2.y - 26); ctx.lineTo(f2.x, f2.y - 26 * f2.s); ctx.stroke();
  }

  // far suspension towers + cables
  const tf = 0.72;
  for (const side of ["l", "r"]) {
    const e = roadEdge(tf, side);
    const th = 170 * e.s;
    ctx.fillStyle = "#232838";
    ctx.fillRect(e.x - 5 * e.s, e.y - th, 10 * e.s, th);
    ctx.fillRect(e.x - 8 * e.s, e.y - th, 16 * e.s, 6 * e.s); // cap
  }
  // main cables sweeping from screen top corners through far towers to the horizon
  const lt = roadEdge(tf, "l"), rt = roadEdge(tf, "r");
  const vp = { x: G.W / 2, y: HORIZON };
  ctx.strokeStyle = "#2c3244";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(-24, 30);
  ctx.quadraticCurveTo(lt.x - 40, lt.y - 20, lt.x, lt.y - 170 * lt.s);
  ctx.quadraticCurveTo(lt.x + 40, HORIZON - 12, vp.x - 14, vp.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(G.W + 24, 30);
  ctx.quadraticCurveTo(rt.x + 40, rt.y - 20, rt.x, rt.y - 170 * rt.s);
  ctx.quadraticCurveTo(rt.x - 40, HORIZON - 12, vp.x + 14, vp.y);
  ctx.stroke();
  // hanger cables on the near span
  ctx.strokeStyle = "rgba(44,50,68,0.7)";
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 7; i++) {
    const d = tf * (i / 7) * 0.9;
    for (const side of ["l", "r"]) {
      const e = roadEdge(d, side);
      const cableY = 30 + (e.y - 170 * 0.2 - 30) * Math.pow(i / 7, 1.4);
      ctx.beginPath(); ctx.moveTo(e.x, e.y - 26 * e.s); ctx.lineTo(e.x + (side === "l" ? -8 : 8) * (1 - d), cableY); ctx.stroke();
    }
  }
}

// ---------- Scenery: frozen pass (the second environment, see ENVS in game/core.js) ----------
const MOON = { x: 96, y: 78 };
const PEAKS_FAR = [[0, 150], [40, 120], [85, 160], [130, 105], [180, 150], [225, 95], [275, 145], [320, 112], [365, 150], [400, 128]];
const PEAKS_NEAR = [[0, 172], [55, 150], [110, 178], [160, 158], [215, 180], [270, 152], [330, 176], [400, 156]];
function poly(pts, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
function drawPassSky() {
  const t = performance.now() / 1000;
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
  sky.addColorStop(0, "#050816");
  sky.addColorStop(0.6, "#0f1a38");
  sky.addColorStop(1, "#2b3f68");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, G.W, HORIZON + 40);
  // twinkling stars
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 40; i++) {
    ctx.globalAlpha = 0.45 + 0.35 * Math.sin(t * 1.5 + i * 1.7);
    ctx.fillRect((i * 67) % G.W, (i * 41) % 150, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;
  // moon with glow
  const glow = ctx.createRadialGradient(MOON.x, MOON.y, 4, MOON.x, MOON.y, 64);
  glow.addColorStop(0, "rgba(200,220,255,0.55)");
  glow.addColorStop(1, "rgba(200,220,255,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(MOON.x - 64, MOON.y - 64, 128, 128);
  ctx.fillStyle = "#e8f0ff";
  ctx.beginPath(); ctx.arc(MOON.x, MOON.y, 17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#c9d6ea";
  ctx.beginPath(); ctx.arc(MOON.x - 5, MOON.y - 3, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(MOON.x + 6, MOON.y + 5, 2.5, 0, Math.PI * 2); ctx.fill();
}
function drawPassGround() {
  poly([[0, HORIZON + 4], ...PEAKS_FAR, [G.W, HORIZON + 4]], "#16223f");
  ctx.globalAlpha = 0.85;
  for (const [x, y] of PEAKS_FAR) {
    if (y > 125) continue; // only the tall ones carry snow
    poly([[x, y], [x - 11, y + 13], [x - 4, y + 9], [x + 2, y + 14], [x + 11, y + 13]], "#c9d6e8");
  }
  ctx.globalAlpha = 1;
  poly([[0, HORIZON + 4], ...PEAKS_NEAR, [G.W, HORIZON + 4]], "#22335a");
  const snow = ctx.createLinearGradient(0, HORIZON, 0, G.H);
  snow.addColorStop(0, "#4a5f85");
  snow.addColorStop(0.35, "#8ea3c4");
  snow.addColorStop(1, "#c9d6e8");
  ctx.fillStyle = snow;
  ctx.fillRect(0, HORIZON, G.W, G.H - HORIZON);
}
function drawPine(x, y, k) {
  ctx.fillStyle = "#2a2118";
  ctx.fillRect(x - 2 * k, y - 10 * k, 4 * k, 10 * k);
  poly([[x - 15 * k, y - 8 * k], [x + 15 * k, y - 8 * k], [x, y - 44 * k]], "#173530");
  poly([[x - 11 * k, y - 30 * k], [x + 11 * k, y - 30 * k], [x, y - 66 * k]], "#1d423b");
  poly([[x - 5 * k, y - 50 * k], [x + 5 * k, y - 50 * k], [x, y - 66 * k]], "#dfe8f5");
}
function drawPassRoad() {
  const nearS = 1.55;
  const nl = G.W / 2 + (G.ROAD_L - G.ROAD_MID) * XS * nearS;
  const nr = G.W / 2 + (G.ROAD_R - G.ROAD_MID) * XS * nearS;
  const fl = roadEdge(1, "l"), fr = roadEdge(1, "r");
  const road = ctx.createLinearGradient(0, HORIZON, 0, G.H);
  road.addColorStop(0, "#3a4150");
  road.addColorStop(1, "#262b35");
  poly([[nl, G.H], [fl.x, fl.y], [fr.x, fr.y], [nr, G.H]], road);
  // snow banks along both edges
  poly([[nl, G.H], [fl.x, fl.y], [fl.x - 3, fl.y], [nl - 30, G.H]], "#e6eef8");
  poly([[nr, G.H], [fr.x, fr.y], [fr.x + 3, fr.y], [nr + 30, G.H]], "#e6eef8");

  for (let i = 0; i < 14; i++) {
    const d0 = i / 14, d1 = d0 + 0.55 / 14;
    const a = proj(G.ROAD_MID, G.PLAYER_Y * (1 - d0));
    const b = proj(G.ROAD_MID, G.PLAYER_Y * (1 - d1));
    poly([
      [a.x - 2.6 * a.s, a.y], [a.x + 2.6 * a.s, a.y],
      [b.x + 2.6 * b.s, b.y], [b.x - 2.6 * b.s, b.y],
    ], "rgba(255,255,255,0.22)");
  }

  // pines and red-tipped snow poles, far to near
  ctx.lineCap = "round";
  for (let i = 0; i < 10; i++) {
    const d = 0.92 - i * 0.1;
    for (const side of ["l", "r"]) {
      const e = roadEdge(d, side);
      const out = side === "l" ? -1 : 1;
      const off = 36 + ((i * 37 + (side === "l" ? 0 : 19)) % 50);
      drawPine(e.x + out * off * e.s, e.y, e.s);
      const px = e.x + out * 5 * e.s;
      ctx.lineWidth = 2 * e.s;
      ctx.strokeStyle = "#c9d3e0";
      ctx.beginPath(); ctx.moveTo(px, e.y); ctx.lineTo(px, e.y - 22 * e.s); ctx.stroke();
      ctx.strokeStyle = "#e0342f";
      ctx.beginPath(); ctx.moveTo(px, e.y - 22 * e.s); ctx.lineTo(px, e.y - 28 * e.s); ctx.stroke();
    }
  }
}
function drawSnowfall() {
  const t = performance.now() / 1000;
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 46; i++) {
    const x = (((i * 97 + t * (10 + (i % 5) * 5) + Math.sin(t + i) * 8) % G.W) + G.W) % G.W;
    const y = (i * 131 + t * (45 + (i % 7) * 11)) % G.H;
    ctx.globalAlpha = 0.35 + (i % 4) * 0.15;
    ctx.beginPath(); ctx.arc(x, y, 1 + (i % 3) * 0.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// What to draw behind the actors, and in front of them, per environment.
const SCENES = {
  bridge: {
    back: () => { drawSky(); drawWaterAndCity(); drawBridge(); },
  },
  pass: {
    back: () => { drawPassSky(); drawPassGround(); drawPassRoad(); },
    front: drawSnowfall,
  },
};

// ---------- Actors ----------
function shadow(px, py, w) {
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(px, py, w, w * 0.28, 0, 0, Math.PI * 2); ctx.fill();
}

// Distinct look per enemy kind (see KIND_STATS in game/core.js)
const ZPAL = {
  walker:   { skin: "#86bb4d", shirt: "#3f5a35" },
  runner:   { skin: "#b4c94e", shirt: "#6b6f2a" },
  tank:     { skin: "#7fa08a", shirt: "#41535d", armor: "#5a6d78" },
  brute:    { skin: "#c97a4a", shirt: "#6e3a1f" },
  summoner: { skin: "#b08ae0", shirt: "#4b2d73" },
  colossus: { skin: "#9aa7b3", shirt: "#4a5560" },
  yeti:     { skin: "#eef5fb", shirt: "#a9c8dc" },
  bomber:   { skin: "#d8a04a", shirt: "#7a2f1f" },
  weaver:   { skin: "#7fd6c9", shirt: "#2c5a58" },
  spitter:  { skin: "#c6d94a", shirt: "#4a5a1c" },
};
const ZICE = { skin: "#bfe6ff", shirt: "#6fa8d6", armor: "#8fbfe0" }; // any kind, while frozen

function drawZombie(z, frozen) {
  const p = proj(z.x, z.y);
  const k = p.s * (z.size / 13) * ACTOR_SCALE;
  const wob = Math.sin(z.wob);
  ctx.globalAlpha = fogAlpha(z.y);
  shadow(p.x, p.y, 15 * k);

  const pal = frozen ? ZICE : ZPAL[z.kind] || ZPAL.walker;
  const skin = pal.skin;
  const shirt = pal.shirt;
  const pants = "#2e3440";

  // legs (shambling)
  ctx.strokeStyle = pants;
  ctx.lineWidth = 5 * k;
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(p.x - 5 * k, p.y - 18 * k); ctx.lineTo(p.x - 6 * k + wob * 3 * k, p.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x + 5 * k, p.y - 18 * k); ctx.lineTo(p.x + 6 * k - wob * 3 * k, p.y); ctx.stroke();

  // torso: ragged shirt
  ctx.fillStyle = shirt;
  ctx.beginPath();
  ctx.moveTo(p.x - 11 * k, p.y - 40 * k);
  ctx.lineTo(p.x + 11 * k, p.y - 40 * k);
  ctx.lineTo(p.x + 9 * k, p.y - 16 * k);
  ctx.lineTo(p.x + 3 * k, p.y - 20 * k);
  ctx.lineTo(p.x - 3 * k, p.y - 15 * k);
  ctx.lineTo(p.x - 9 * k, p.y - 19 * k);
  ctx.closePath(); ctx.fill();

  // arms reaching out at you
  ctx.strokeStyle = skin;
  ctx.lineWidth = 4.5 * k;
  ctx.beginPath(); ctx.moveTo(p.x - 10 * k, p.y - 37 * k); ctx.lineTo(p.x - 17 * k, p.y - 26 * k + wob * 4 * k); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x + 10 * k, p.y - 37 * k); ctx.lineTo(p.x + 17 * k, p.y - 26 * k - wob * 4 * k); ctx.stroke();
  // hands
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(p.x - 17 * k, p.y - 26 * k + wob * 4 * k, 3 * k, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x + 17 * k, p.y - 26 * k - wob * 4 * k, 3 * k, 0, Math.PI * 2); ctx.fill();

  // armor plate on tanks
  if (z.kind === "tank") {
    ctx.fillStyle = pal.armor;
    ctx.fillRect(p.x - 8 * k, p.y - 38 * k, 16 * k, 14 * k);
  } else if (z.kind === "bomber") {
    // swollen, glowing belly
    ctx.fillStyle = frozen ? "#8fbfe0" : "#ff6a3c";
    ctx.beginPath(); ctx.arc(p.x, p.y - 27 * k, (8.5 + Math.sin(z.wob * 1.5) * 1.5) * k, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = frozen ? "#dff2ff" : "#ffd27a";
    ctx.beginPath(); ctx.arc(p.x, p.y - 27 * k, 4 * k, 0, Math.PI * 2); ctx.fill();
  } else if (z.kind === "weaver") {
    ctx.fillStyle = "#e8f0ff";
    ctx.fillRect(p.x - 10 * k, p.y - 33 * k, 20 * k, 3 * k);
  }

  // head with face - it's looking AT you (bosses get glowing red eyes)
  const hy = p.y - 48 * k + wob * 1.5 * k;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(p.x, hy, 8 * k, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = z.boss ? "#e02020" : "#1d2410";
  ctx.beginPath(); ctx.arc(p.x - 3 * k, hy - 1.5 * k, 1.6 * k, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x + 3 * k, hy - 1.5 * k, 1.6 * k, 0, Math.PI * 2); ctx.fill();
  if (z.kind === "yeti") {
    // horns
    ctx.strokeStyle = "#5d7f99";
    ctx.lineWidth = 2.6 * k;
    ctx.beginPath(); ctx.moveTo(p.x - 5 * k, hy - 6 * k); ctx.lineTo(p.x - 10 * k, hy - 13 * k); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x + 5 * k, hy - 6 * k); ctx.lineTo(p.x + 10 * k, hy - 13 * k); ctx.stroke();
  }
  if (z.kind === "spitter") {
    ctx.fillStyle = frozen ? "#dff2ff" : "#b6e33c"; // mouth full of acid
    ctx.beginPath(); ctx.arc(p.x, hy + 3.5 * k, 3 * k, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = "#1d2410";
    ctx.fillRect(p.x - 3 * k, hy + 3 * k, 6 * k, 1.8 * k); // snarl
  }

  // HP bar
  if (z.hp < z.maxHp || z.big) {
    const w = 26 * k;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(p.x - w / 2, hy - 15 * k, w, 3.5 * k);
    ctx.fillStyle = "#e0342f";
    ctx.fillRect(p.x - w / 2, hy - 15 * k, w * (z.hp / z.maxHp), 3.5 * k);
  }
  ctx.globalAlpha = 1;
}

// cold: the squad's guns are iced up (a yeti's throw), so it is drawn frosted over.
function drawSoldier(x, y, firing, cold) {
  const p = proj(x, y);
  const k = p.s * ACTOR_SCALE;
  shadow(p.x, p.y, 10 * k);

  // legs
  ctx.strokeStyle = "#2c3444";
  ctx.lineWidth = 4.5 * k;
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(p.x - 4 * k, p.y - 14 * k); ctx.lineTo(p.x - 4 * k, p.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x + 4 * k, p.y - 14 * k); ctx.lineTo(p.x + 4 * k, p.y); ctx.stroke();

  // torso (seen from behind) + backpack
  ctx.fillStyle = cold ? "#8fbfe0" : "#4a5d3a";
  ctx.beginPath();
  ctx.moveTo(p.x - 8 * k, p.y - 32 * k);
  ctx.lineTo(p.x + 8 * k, p.y - 32 * k);
  ctx.lineTo(p.x + 7 * k, p.y - 12 * k);
  ctx.lineTo(p.x - 7 * k, p.y - 12 * k);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = cold ? "#6fa8d6" : "#3a4a2e";
  ctx.fillRect(p.x - 5 * k, p.y - 29 * k, 10 * k, 11 * k);

  // rifle poking up over the right shoulder
  ctx.strokeStyle = cold ? "#dff2ff" : "#1c1f26";
  ctx.lineWidth = 3 * k;
  ctx.beginPath(); ctx.moveTo(p.x + 5 * k, p.y - 30 * k); ctx.lineTo(p.x + 7 * k, p.y - 46 * k); ctx.stroke();

  // muzzle flash
  if (firing) {
    ctx.beginPath();
    const fx = p.x + 7.5 * k, fy = p.y - 49 * k;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i - 2) * 0.5;
      ctx.moveTo(fx, fy);
      ctx.lineTo(fx + Math.cos(a) * 7 * k, fy + Math.sin(a) * 7 * k);
    }
    ctx.strokeStyle = "#ffe27a";
    ctx.lineWidth = 2 * k;
    ctx.stroke();
  }

  // helmet
  ctx.fillStyle = cold ? "#bfe6ff" : "#39452e";
  ctx.beginPath(); ctx.arc(p.x, p.y - 38 * k, 6.5 * k, Math.PI, 0); ctx.fill();
  ctx.fillRect(p.x - 6.5 * k, p.y - 38 * k, 13 * k, 3 * k);
  ctx.fillStyle = "#c9a06c";
  ctx.fillRect(p.x - 4 * k, p.y - 35.5 * k, 8 * k, 2.5 * k); // neck
}

function drawGate(g) {
  const p = proj(G.ROAD_MID, g.y);
  const halves = [
    { x0: G.ROAD_L + 4, x1: G.ROAD_MID - 2, e: g.left },
    { x0: G.ROAD_MID + 2, x1: G.ROAD_R - 4, e: g.right },
  ];
  ctx.globalAlpha = fogAlpha(g.y);
  for (const h of halves) {
    const a = proj(h.x0, g.y), b = proj(h.x1, g.y);
    const hgt = 92 * p.s;
    // glow
    ctx.shadowColor = h.e.color;
    ctx.shadowBlur = 14 * p.s;
    ctx.fillStyle = h.e.color + "44";
    ctx.fillRect(a.x, a.y - hgt, b.x - a.x, hgt);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = h.e.color;
    ctx.lineWidth = 2.5 * p.s;
    ctx.strokeRect(a.x, a.y - hgt, b.x - a.x, hgt);
    // posts
    ctx.fillStyle = "#d8dde6";
    ctx.fillRect(a.x - 2 * p.s, a.y - hgt, 4 * p.s, hgt);
    ctx.fillRect(b.x - 2 * p.s, b.y - hgt, 4 * p.s, hgt);
    // label
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.max(9, 22 * p.s) + "px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(h.e.label, (a.x + b.x) / 2, a.y - hgt * 0.42);
  }
  ctx.globalAlpha = 1;
}

function drawBullet(b) {
  const p = proj(b.x, b.y);
  const w = G.WEAPONS[b.wkey] || G.WEAPONS.rifle;
  ctx.globalAlpha = fogAlpha(b.y);
  ctx.strokeStyle = w.color;
  ctx.shadowColor = w.color;
  ctx.shadowBlur = 6 * p.s;
  ctx.lineWidth = (w.aoe ? 4.5 : w.pierce ? 3.5 : 2.5) * p.s;
  const len = w.pierce ? 18 : 10;
  ctx.beginPath(); ctx.moveTo(p.x, p.y - 30 * p.s); ctx.lineTo(p.x, p.y - (30 + len) * p.s); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}


// Acid lobbed by a spitter, or a lump of ice thrown by a yeti.
function drawSpit(sp) {
  const p = proj(sp.x, sp.y);
  const r = sp.ice ? 11 : 8;
  ctx.globalAlpha = fogAlpha(sp.y);
  shadow(p.x, p.y, r * p.s);
  ctx.fillStyle = sp.ice ? "#9fd8ff" : "#b6e33c";
  ctx.beginPath(); ctx.arc(p.x, p.y - 26 * p.s, r * p.s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = sp.ice ? "#ffffff" : "#e6ff8a";
  ctx.beginPath(); ctx.arc(p.x - 2.5 * p.s, p.y - 28.5 * p.s, (r - 5) * p.s, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

// A power-up crate (see POWERUPS in game/core.js).
function drawDrop(d) {
  const p = proj(d.x, d.y);
  const k = p.s * ACTOR_SCALE;
  const fog = fogAlpha(d.y);
  const pu = G.POWERUPS[d.type];
  const cy = p.y - 16 * k;
  ctx.globalAlpha = fog;
  shadow(p.x, p.y, 14 * k);
  ctx.globalAlpha = 0.22 * fog;
  ctx.fillStyle = pu.color;
  ctx.beginPath(); ctx.arc(p.x, cy, 22 * k, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = fog;
  ctx.fillStyle = "#1a2230";
  ctx.strokeStyle = pu.color;
  ctx.lineWidth = 2.5 * k;
  ctx.beginPath(); ctx.roundRect(p.x - 13 * k, cy - 12 * k, 26 * k, 24 * k, 4 * k); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2.2 * k;
  ctx.lineCap = "round";
  ctx.beginPath();
  if (d.type === "freeze") {
    // snowflake
    for (let i = 0; i < 3; i++) {
      const a = (i * Math.PI) / 3;
      ctx.moveTo(p.x - Math.cos(a) * 8 * k, cy - Math.sin(a) * 8 * k);
      ctx.lineTo(p.x + Math.cos(a) * 8 * k, cy + Math.sin(a) * 8 * k);
    }
  } else if (d.type === "airstrike") {
    // falling bomb
    poly([[p.x - 6 * k, cy - 7 * k], [p.x + 6 * k, cy - 7 * k], [p.x, cy + 8 * k]], pu.color);
    ctx.beginPath();
    ctx.moveTo(p.x - 6 * k, cy - 9 * k); ctx.lineTo(p.x + 6 * k, cy - 9 * k);
  } else {
    // chevrons: faster
    for (const dy of [-5, 2]) {
      ctx.moveTo(p.x - 6 * k, cy + (dy + 5) * k);
      ctx.lineTo(p.x, cy + dy * k);
      ctx.lineTo(p.x + 6 * k, cy + (dy + 5) * k);
    }
  }
  ctx.stroke();
  ctx.fillStyle = pu.color;
  ctx.font = "bold " + Math.max(7, 22 * p.s * 0.62) + "px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(pu.label, p.x, cy - 20 * k);
  ctx.globalAlpha = 1;
}

// ---------- Walls / HUD ----------
function drawWall(w) {
  const a = proj(G.ROAD_L + 6, w.y), b = proj(G.ROAD_R - 6, w.y);
  const s = proj(G.ROAD_MID, w.y).s * ACTOR_SCALE;
  const h = 26 * s;
  ctx.globalAlpha = fogAlpha(w.y);
  // planks
  ctx.fillStyle = "#8a6b42";
  ctx.fillRect(a.x, a.y - h, b.x - a.x, h);
  ctx.fillStyle = "#6e5230";
  ctx.fillRect(a.x, a.y - h, b.x - a.x, 4 * s);
  ctx.fillRect(a.x, a.y - h / 2, b.x - a.x, 3 * s);
  // posts
  ctx.fillStyle = "#54401f";
  for (let i = 0; i <= 6; i++) {
    const px = a.x + ((b.x - a.x) * i) / 6;
    ctx.fillRect(px - 2 * s, a.y - h - 6 * s, 4 * s, h + 6 * s);
  }
  // hp bar
  const bw = (b.x - a.x) * 0.5;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect((a.x + b.x) / 2 - bw / 2, a.y - h - 15 * s, bw, 5 * s);
  ctx.fillStyle = "#4dd0c4";
  ctx.fillRect((a.x + b.x) / 2 - bw / 2, a.y - h - 15 * s, bw * (w.hp / w.maxHp), 5 * s);
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, 0, G.W, 48);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.fillText("SCORE " + game.score, 12, 31);
  ctx.textAlign = "center"; ctx.fillText("WAVE " + game.wave, G.W / 2 - 10, 31);
  ctx.textAlign = "right"; ctx.fillText("BEST " + game.best, G.W - 52, 31);
  // pause button
  const pb = G.PAUSE_BTN;
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.beginPath(); ctx.roundRect(pb.x, pb.y, pb.w, pb.h, 8); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(pb.x + 11, pb.y + 9, 5, 18);
  ctx.fillRect(pb.x + 20, pb.y + 9, 5, 18);
  ctx.textAlign = "center";
  ctx.font = "16px system-ui, sans-serif";
  ctx.fillStyle = "#9fd4ff";
  ctx.fillText(
    G.WEAPONS[game.player.weapon].label + "   troops " + game.player.troops + "   dmg " + game.player.damage + "   rate " + game.player.fireRate.toFixed(1),
    G.W / 2, G.H - 14
  );
  if (game.daily !== null) centerText("DAILY CHALLENGE", G.H - 36, "13", DAILY_COLOR);
}
// Running power-ups, as shrinking bars under the top bar. Iced-up guns (a
// yeti's throw) get a bar of their own.
const CHILL_BAR = { label: "GUNS FROZEN", color: "#e0342f", time: G.CHILL_TIME };
function drawEffects() {
  const fx = game.effects;
  const on = [["freeze", fx.freeze], ["rapid", fx.rapid], ["airstrike", fx.strike], ["chill", fx.chill]].filter((e) => e[1] > 0);
  const w = on.length > 3 ? 88 : 112, h = 20, gap = 8;
  let x = G.W / 2 - (on.length * (w + gap) - gap) / 2;
  for (const [key, left] of on) {
    const pu = key === "chill" ? CHILL_BAR : G.POWERUPS[key];
    panel(x, 134, w, h, 6, "rgba(5,8,14,0.75)");
    ctx.globalAlpha = 0.45;
    panel(x, 134, w * Math.min(1, left / pu.time), h, 6, pu.color);
    ctx.globalAlpha = 1;
    label(pu.label, x + w / 2, 149, "13", "#fff");
    x += w + gap;
  }
}

// ---------- Menus and overlays (mirrors App.jsx) ----------
const FONT = "px system-ui, sans-serif";
function label(str, x, y, font, color, align = "center") {
  ctx.font = font + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.fillText(str, x, y);
}
const centerText = (str, y, font, color) => label(str, G.W / 2, y, font, color);
function panel(x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}
function dim(color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, G.W, G.H);
}
// k scales the label of a secondary button down (see drawMenu).
function drawButton(b, str, primary, k = 1) {
  const mid = b.x + b.w / 2;
  if (primary) {
    panel(b.x, b.y, b.w, b.h, 12, "#f5c211");
    label(str, mid, b.y + b.h / 2 + 9, "bold 24", "#1a1405");
  } else {
    panel(b.x, b.y, b.w, b.h, 12, "rgba(255,255,255,0.12)");
    ctx.strokeStyle = "#9fd4ff";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.stroke();
    label(str, mid, b.y + b.h / 2 + 7 * k, "bold " + 20 * k, "#9fd4ff");
  }
}

// A coin and an amount, centered on cx.
function drawCoins(cx, y, amount, font, size, color) {
  const str = String(amount);
  const r = size * 0.4;
  ctx.font = font + FONT;
  const x = cx - (r * 2 + 6 + ctx.measureText(str).width) / 2;
  ctx.fillStyle = "#f5c211";
  ctx.strokeStyle = "#a87b00";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x + r, y - size * 0.34, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  label(str, x + r * 2 + 6, y, font, color, "left");
}

// The daily challenge button: two lines, with today's best once there is one.
function drawDailyButton(b) {
  panel(b.x, b.y, b.w, b.h, 12, "rgba(77,208,196,0.14)");
  ctx.strokeStyle = DAILY_COLOR;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.stroke();
  const d = game.dailyBest;
  const played = d.day === today() && d.best > 0;
  centerText("DAILY CHALLENGE", b.y + 24, "bold 20", DAILY_COLOR);
  centerText(played ? "Your best today: " + d.best : "One run a day, the same for everyone", b.y + 44, "13", "#c8d3e0");
}

// The environment for the next ordinary run; clicking moves on to the next one.
function drawMapButton(b) {
  const env = G.ENVS[game.envPick] || G.ENVS.bridge;
  panel(b.x, b.y, b.w, b.h, 12, "rgba(5,8,14,0.55)");
  ctx.strokeStyle = "#9fd4ff";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.stroke();
  centerText("MAP: " + env.label, b.y + 23, "bold 16", "#9fd4ff");
  centerText(env.desc + "  -  tap to change", b.y + 42, "13", "#c8d3e0");
}

function drawMenu() {
  dim("rgba(0,0,0,0.6)");
  drawMapButton(MAP_BTN);
  centerText("HORDE SURVIVAL", 208, "bold 40", "#fff");
  drawCoins(G.W / 2, 286, game.coins, "21", 21, "#f5c211");
  const btns = game.inRun ? RUN_MENU_BTNS : MENU_BTNS;
  if (game.inRun) {
    centerText((game.daily === null ? "" : "Daily  -  ") + "Wave " + game.wave + "  -  Score " + game.score, 252, "21", "#9fd4ff");
    drawButton(btns.resume, "RESUME", true);
    drawButton(btns.fight, "NEW RUN");
  } else {
    centerText(game.best > 0 ? "Best: " + game.best : game.envPick === "pass" ? "Hold the pass." : "Hold the bridge.", 252, "21", "#9fd4ff");
    drawButton(btns.fight, "FIGHT HORDE", true);
    centerText("Drag to move - you fire automatically", 618, "16", "#c8d3e0");
    centerText("Steer into gates - avoid the red ones!", 642, "16", "#c8d3e0");
  }
  drawDailyButton(btns.daily);
  // the four half-width buttons share one label size: the largest at which the longest fits
  const grid = { shop: "UPGRADES", awards: "ACHIEVEMENTS", board: "LEADERBOARDS", settings: "SETTINGS" };
  ctx.font = "bold 20" + FONT;
  const widest = Math.max(...Object.values(grid).map((str) => ctx.measureText(str).width));
  const k = Math.min(1, (btns.shop.w - 28) / widest);
  for (const key of Object.keys(grid)) drawButton(btns[key], grid[key], false, k);
}

function drawAwards() {
  dim("rgba(5,8,14,0.94)");
  centerText("ACHIEVEMENTS", 64, "bold 40", "#fff");
  const done = AWARD_ROWS.filter((r) => game.achieved[r.id]).length;
  centerText(done + " of " + AWARD_ROWS.length + " unlocked", 94, "16", "#9fd4ff");
  for (const r of AWARD_ROWS) {
    if (r.page !== ui.awardsPage) continue;
    const on = !!game.achieved[r.id];
    panel(r.x, r.y, r.w, r.h, 10, on ? "rgba(245,194,17,0.14)" : "rgba(255,255,255,0.07)");
    // a pip that fills in once the achievement is unlocked
    ctx.beginPath(); ctx.arc(r.x + 20, r.y + r.h / 2, on ? 7 : 6, 0, Math.PI * 2);
    if (on) { ctx.fillStyle = "#f5c211"; ctx.fill(); }
    else { ctx.strokeStyle = "#8b93a3"; ctx.lineWidth = 2; ctx.stroke(); }
    label(r.label, r.x + 38, r.y + 24, "bold 16", on ? "#f5c211" : "#fff", "left");
    label(r.desc, r.x + 38, r.y + 43, "13", on ? "#c8d3e0" : "#8b93a3", "left");
    drawCoins(r.x + r.w - 34, r.y + r.h / 2 + 6, r.coins, "16", 16, on ? "#f5c211" : "#8b93a3");
  }
  centerText("PAGE " + (ui.awardsPage + 1) + " OF " + AWARD_PAGES, 632, "13", "#8b93a3");
  if (ui.awardsPage > 0) drawButton(AWARD_PAGE_BTNS.prev, "<");
  if (ui.awardsPage < AWARD_PAGES - 1) drawButton(AWARD_PAGE_BTNS.next, ">");
  drawButton(AWARDS_BACK_BTN, "BACK");
}

// Shown for a few seconds when an achievement unlocks. a: an entry of G.ACHIEVEMENTS.
function drawToast(a) {
  const msg = a.label + "   +" + a.coins;
  ctx.font = "bold 20" + FONT;
  const tw = ctx.measureText(msg).width;
  ctx.font = "13" + FONT;
  const w = Math.max(tw, ctx.measureText("ACHIEVEMENT UNLOCKED").width) + 40;
  panel(G.W / 2 - w / 2, 56, w, 52, 12, "rgba(5,8,14,0.88)");
  ctx.strokeStyle = "#f5c211";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(G.W / 2 - w / 2, 56, w, 52, 12); ctx.stroke();
  centerText("ACHIEVEMENT UNLOCKED", 75, "13", "#c8d3e0");
  centerText(msg, 98, "bold 20", "#f5c211");
}

function drawShop() {
  dim("rgba(5,8,14,0.92)");
  centerText("UPGRADES", 84, "bold 40", "#fff");
  drawCoins(G.W / 2, 128, game.coins, "bold 24", 24, "#f5c211");
  for (const r of UPGRADE_ROWS) {
    const u = G.UPGRADES[r.key];
    const level = game.upgrades[r.key], top = u.costs.length;
    const cost = G.upgradeCost(game, r.key);
    panel(r.x, r.y, r.w, r.h, 12, "rgba(255,255,255,0.08)");
    label(u.label, r.x + 16, r.y + 30, "bold 20", "#fff", "left");
    label(u.desc, r.x + 16, r.y + 53, "16", "#c8d3e0", "left");
    // one pip per level, then what the level gives now and next
    for (let i = 0; i < top; i++) panel(r.x + 16 + i * 20, r.y + 68, 15, 10, 3, i < level ? "#f5c211" : "rgba(255,255,255,0.18)");
    const value = u.value(level) + (cost === null ? "" : "  >  " + u.value(level + 1));
    label(value, r.x + 24 + top * 20, r.y + 79, "16", "#9fd4ff", "left");
    // price
    const bx = r.x + r.w - 96, by = r.y + 22, bw = 82, bh = 52;
    if (cost === null) {
      label("MAX", bx + bw / 2, by + bh / 2 + 7, "bold 20", "#8fe3a8");
    } else if (game.coins >= cost) {
      panel(bx, by, bw, bh, 10, "#f5c211");
      drawCoins(bx + bw / 2, by + bh / 2 + 7, cost, "bold 20", 20, "#1a1405");
    } else {
      panel(bx, by, bw, bh, 10, "rgba(255,255,255,0.08)");
      drawCoins(bx + bw / 2, by + bh / 2 + 7, cost, "bold 20", 20, "#8b93a3");
    }
  }
  centerText("Every run pays coins when it ends.", 524, "16", "#c8d3e0");
  centerText("Starting upgrades count from the next run.", 548, "16", "#c8d3e0");
  drawButton(BACK_BTN, "BACK");
}

function drawConfirmNew() {
  const daily = ui.confirmNew === "daily";
  dim("rgba(5,8,14,0.92)");
  centerText(daily ? "START DAILY?" : "NEW RUN?", 236, "bold 40", "#fff");
  centerText("Your current run will be lost.", 284, "21", "#9fd4ff");
  centerText("Wave " + game.wave + "  -  Score " + game.score, 316, "16", "#c8d3e0");
  drawButton(CONFIRM_BTNS.cancel, "KEEP MY RUN", true);
  drawButton(CONFIRM_BTNS.yes, daily ? "START DAILY RUN" : "START NEW RUN");
}

function drawSettings() {
  dim("rgba(5,8,14,0.92)");
  centerText("SETTINGS", 84, "bold 40", "#fff");
  for (const r of SETTING_ROWS) {
    const on = settings[r.key];
    panel(r.x, r.y, r.w, r.h, 12, "rgba(255,255,255,0.08)");
    label(r.label, r.x + 18, r.y + r.h / 2 + 7, "bold 20", "#fff", "left");
    // toggle switch
    const sw = 58, sh = 30, sx = r.x + r.w - sw - 16, sy = r.y + (r.h - sh) / 2;
    panel(sx, sy, sw, sh, sh / 2, on ? "#3fbf6a" : "#4a5160");
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(on ? sx + sw - sh / 2 : sx + sh / 2, sy + sh / 2, sh / 2 - 4, 0, Math.PI * 2); ctx.fill();
    label(on ? "ON" : "OFF", sx - 12, r.y + r.h / 2 + 6, "16", on ? "#8fe3a8" : "#8b93a3", "right");
  }
  drawButton(BACK_BTN, "BACK");
}

// The leaderboard client lives in the app (leaderboard.js); this page only
// keeps the button so the menu matches. A daily run here is the same run as
// in the app that day, but its score goes on no board.
function drawBoard() {
  dim("rgba(5,8,14,0.92)");
  centerText("LEADERBOARD", 84, "bold 40", "#fff");
  centerText("Only available in the app.", G.H / 2, "21", "#9fd4ff");
  centerText("TAP TO CLOSE", G.H - 34, "bold 24", "#f5c211");
}

// First-run hints: shown during wave 1 until the player has moved and taken a
// gate. After those, whenever a crate is on the road, until one is taken.
function tutorialHint() {
  if (game.state !== "playing") return null;
  if (tutorial.on && game.wave === 1) {
    if (tutorial.moved < 40) return { title: "DRAG LEFT / RIGHT TO MOVE", sub: "Your squad fires on its own" };
    if (game.gates.some((gate) => !gate.used && gate.y > 0)) return { title: "STEER INTO A GATE", sub: "Pick a side - avoid the red ones!" };
  }
  if (tutorial.crate && game.drops.some((d) => d.y > 0)) return { title: "GRAB THE CRATE", sub: "Steer into it for a power-up" };
  return null;
}
function drawHint(h) {
  ctx.font = "bold 20" + FONT;
  const tw = ctx.measureText(h.title).width;
  ctx.font = "16" + FONT;
  const w = Math.max(tw, ctx.measureText(h.sub).width) + 36;
  panel(G.W / 2 - w / 2, 64, w, 64, 12, "rgba(5,8,14,0.78)");
  centerText(h.title, 91, "bold 20", "#f5c211");
  centerText(h.sub, 115, "16", "#fff");
}

const fmtTime = (sec) => {
  const s = Math.floor(sec);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};

// Pause / game-over overlay. Tapping anywhere but the button resumes / retries.
function drawOverlay() {
  dim("rgba(0,0,0,0.6)");
  const daily = game.daily !== null;
  if (daily) centerText("DAILY CHALLENGE", game.state === "paused" ? G.H / 2 - 112 : 192, "bold 20", DAILY_COLOR);
  if (game.state === "paused") {
    centerText("PAUSED", G.H / 2 - 60, "bold 40", "#fff");
    centerText("Score: " + game.score, G.H / 2 - 10, "21", "#9fd4ff");
    centerText("TAP TO RESUME", G.H / 2 + 90, "bold 24", "#f5c211");
  } else {
    centerText("OVERRUN!", 236, "bold 40", "#fff");
    centerText("Score: " + game.score, 280, "bold 24", "#fff");
    // run summary: wave reached, time survived, kills, coins earned
    panel(40, 302, G.W - 80, 70, 12, "rgba(255,255,255,0.08)");
    const stats = [["WAVE", String(game.wave)], ["TIME", fmtTime(game.elapsed)], ["KILLS", String(game.kills)], ["COINS", "+" + game.earned]];
    stats.forEach(([name, value], i) => {
      label(value, 80 + i * 80, 334, "bold 20", i === 3 ? "#f5c211" : "#fff");
      label(name, 80 + i * 80, 358, "16", "#9fd4ff");
    });
    if (game.newBest) centerText("★ NEW BEST! ★", 410, "bold 24", "#ffd84d");
    else if (game.newDailyBest) centerText("★ BEST TODAY! ★", 410, "bold 24", DAILY_COLOR);
    else if (daily && game.dailyBest.day === game.daily) centerText("Best today: " + game.dailyBest.best, 406, "21", "#9fd4ff");
    else centerText("Best: " + game.best, 406, "21", "#9fd4ff");
    centerText("TAP TO RETRY", G.H / 2 + 90, "bold 24", "#f5c211");
  }
  drawButton(HOME_BTN, "MAIN MENU");
}

// ---------- Frame ----------
function draw() {
  ctx.save();
  if (game.shake > 0 && settings.shake) ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);

  const scene = SCENES[G.sceneEnv(game)];
  scene.back();

  // everything on the road, far to near
  const frozen = game.effects.freeze > 0;
  const actors = [
    ...game.gates.map((g) => ({ y: g.y, kind: "gate", ref: g })),
    ...game.zombies.map((z) => ({ y: z.y, kind: "zombie", ref: z })),
    ...game.walls.map((w) => ({ y: w.y, kind: "wall", ref: w })),
    ...game.drops.map((d) => ({ y: d.y, kind: "drop", ref: d })),
    ...game.spits.map((sp) => ({ y: sp.y, kind: "spit", ref: sp })),
  ].sort((a, b) => a.y - b.y);
  for (const a of actors) {
    if (a.kind === "gate") drawGate(a.ref);
    else if (a.kind === "wall") drawWall(a.ref);
    else if (a.kind === "drop") drawDrop(a.ref);
    else if (a.kind === "spit") drawSpit(a.ref);
    else drawZombie(a.ref, frozen);
  }

  for (const b of game.bullets) drawBullet(b);

  const cold = game.effects.chill > 0;
  const firing = !cold && game.fireTimer > 1 / game.player.fireRate - 0.07;
  const spots = G.formationSpots(game.player.troops, game.player.x);
  for (let i = spots.length - 1; i >= 0; i--) drawSoldier(spots[i].x, spots[i].y, firing, cold);

  for (const p of game.particles) {
    const q = proj(p.x, p.y);
    ctx.globalAlpha = Math.max(0, p.life / 0.35);
    ctx.fillStyle = p.color;
    ctx.fillRect(q.x - 2.5 * q.s, q.y - 2.5 * q.s, 5 * q.s, 5 * q.s);
  }
  ctx.globalAlpha = 1;
  for (const f of game.floaters) {
    const q = proj(f.x, f.y);
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = "bold " + Math.round(22 * Math.min(1.3, Math.max(0.6, q.s))) + "px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(f.text, q.x, q.y - 60 * q.s);
  }
  ctx.globalAlpha = 1;

  if (scene.front) scene.front();
  if (frozen) { // cold haze over the road
    ctx.fillStyle = "rgba(127,212,255,0.1)";
    ctx.fillRect(0, HORIZON, G.W, G.H - HORIZON);
  }
  if (game.flash > 0) { // airstrike
    ctx.fillStyle = "rgba(255,255,255," + game.flash * 0.7 + ")";
    ctx.fillRect(0, 0, G.W, G.H);
  }

  // wave / boss announcement banner
  if (game.banner.life > 0) {
    ctx.globalAlpha = Math.min(1, game.banner.life);
    ctx.font = "bold 40px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.strokeText(game.banner.text, G.W / 2, 300);
    ctx.fillStyle = "#ffd84d";
    ctx.fillText(game.banner.text, G.W / 2, 300);
    ctx.globalAlpha = 1;
  }

  drawHUD();
  drawEffects();
  const hint = tutorialHint();
  if (hint) drawHint(hint);
  ctx.restore();
  if (ui.board) drawBoard();
  else if (ui.settings) drawSettings();
  else if (ui.shop) drawShop();
  else if (ui.awards) drawAwards();
  else if (ui.confirmNew && game.inRun) drawConfirmNew();
  else if (game.state === "menu") drawMenu();
  else if (game.state !== "playing") drawOverlay();
  if (toasts[0]) drawToast(G.ACHIEVEMENTS.find((a) => a.id === toasts[0].id));
}

// ---------- Main loop ----------
let last = performance.now();
let prevState = game.state;
let runStored = null; // unknown until the first frame settles it
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (game.state === "playing") {
    if (keys.ArrowLeft || keys.a) game.player.x -= 280 * dt;
    if (keys.ArrowRight || keys.d) game.player.x += 280 * dt;
    G.update(game, dt, saveBest);
    if (engine) engine.playEvents(game);
    // announce new achievements one after the other, and keep them (with their coins)
    if (game.events.achieved.length) {
      for (const id of game.events.achieved) toasts.push({ id, until: 0 });
      storeMeta();
    }
    // the hints are done once a gate is taken (or wave 1 is over)
    if (tutorial.on && (game.events.gate || game.wave > 1)) {
      tutorial.on = false;
      store.set(TUTORIAL_KEY, "1");
    }
    // and the one for crates once a crate is taken
    if (tutorial.crate && game.events.power) {
      tutorial.crate = false;
      store.set(CRATE_HINT_KEY, "1");
    }
  }
  if (engine) {
    const bossAlive = game.zombies.some((z) => z.boss);
    engine.setMood(game.state === "playing" ? (bossAlive ? "boss" : "play") : "menu");
    if (game.state === "gameover" && prevState === "playing") engine.gameOverJingle(game.newBest);
  }
  if (game.state === "gameover" && prevState === "playing") storeMeta(); // the run just paid out its coins
  if (toasts[0] && !toasts[0].until) toasts[0].until = now + 3200;
  else if (toasts[0] && now > toasts[0].until) toasts.shift();
  // Keep a resumable run stored while it is paused or behind the menu, and
  // drop it the moment play continues or the run ends.
  const keep = G.hasRun(game);
  if (keep !== runStored && (keep || game.state !== "menu")) {
    runStored = keep;
    if (keep) store.set(RUN_KEY, G.saveRun(game));
    else store.del(RUN_KEY);
  }
  prevState = game.state;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
